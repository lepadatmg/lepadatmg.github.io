<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LMG Software</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(1200px 600px at 50% -10%, #152138 0%, #0B1320 62%);
    color: #E7EBF1;
    font: 16px/1.6 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 32px 20px;
  }
  .card { max-width: 560px; width: 100%; text-align: center; }
  .logo {
    width: 76px; height: 76px; border-radius: 18px; margin: 0 auto 22px;
    background: linear-gradient(145deg, #F7931A, #B5610A);
    display: flex; align-items: center; justify-content: center;
    font-size: 42px; font-weight: 800; color: #0B1320;
    box-shadow: 0 10px 30px rgba(247,147,26,.25);
  }
  h1 { font-size: 1.9rem; margin: 0 0 8px; letter-spacing: -.02em; line-height: 1.15; }
  .tagline { color: #9BA7B8; margin: 0 0 4px; }
  .by { color: #6B7688; font-size: .9rem; margin: 0 0 28px; }
  .links { display: flex; flex-direction: column; gap: 10px; max-width: 320px; margin: 0 auto; }
  a.btn {
    display: block; padding: 13px 18px; border-radius: 12px; text-decoration: none;
    font-weight: 600; transition: transform .12s, background .12s, border-color .12s;
  }
  a.primary { background: #F7931A; color: #0B1320; }
  a.primary:hover { background: #ffa634; }
  a.secondary { background: transparent; color: #E7EBF1; border: 1px solid #28374f; }
  a.secondary:hover { border-color: #3a4d6e; }
  a.btn:active { transform: translateY(1px); }
  footer { margin-top: 30px; color: #6B7688; font-size: .85rem; }
  footer a { color: #9BA7B8; }
</style>
</head>
<body>
  <main class="card">
    <div class="logo">&#8383;</div>
    <h1>BTC Miner: Idle Simulator</h1>
    <p class="tagline">An idle crypto&#8209;mining simulator &mdash; build your empire. No real cryptocurrency is mined, held, or paid out.</p>
    <p class="by">by LMG Software</p>
    <div class="links">
      <a class="btn primary" href="https://play.google.com/store/apps/details?id=com.lmgsoftware.btcminer">Get it on Google Play</a>
      <a class="btn secondary" href="https://sites.google.com/view/btcminer-privacypolicy/pagina-de-pornire">Privacy Policy</a>
      <a class="btn secondary" href="mailto:mglepadat@gmail.com">Contact</a>
    </div>
    <footer>&copy; 2026 LMG Software &middot; <a href="mailto:mglepadat@gmail.com">mglepadat@gmail.com</a></footer>
  </main>
</body>
</html>
